<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>PDF 摘要工具</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif;
      background: #1a0000;
      color: #fff;
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    canvas#bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: radial-gradient(ellipse at bottom, #2b0000 0%, #000000 100%);
    }

    .container {
      max-width: 600px;
      width: 100%;
      padding: 60px 20px;
    }

    .card {
      background: rgba(0, 0, 0, 0.85);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 80, 0, 0.9);
      border: 2px solid #ff6600;
    }

    h2 {
      font-size: 24px;
      color: #ffae00;
      text-shadow: 0 0 10px #ffae00;
      text-align: center;
      margin-bottom: 25px;
    }

    input[type="file"] {
      width: 100%;
      font-size: 14px;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .button-row button {
      background: linear-gradient(90deg, #ff6600, #ffae00);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 12px #ff5500;
      transition: all 0.3s ease;
    }

    .button-row button:hover {
      box-shadow: 0 0 20px #ffff33, 0 0 40px #ff6600;
      transform: scale(1.05);
    }

    .summary {
      background: #111;
      padding: 20px;
      border-radius: 12px;
      border-left: 5px solid #ffaa00;
      color: #ffeec0;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- 🔥 背景粒子 -->
  <canvas id="bgCanvas"></canvas>

  <div class="container">
    <div class="card">
      <h2>📄 PDF 摘要工具</h2>

      <!-- 上傳表單 -->
      <form method="POST" enctype="multipart/form-data">
        <input type="file" name="pdf_file" accept="application/pdf" required>
        <div class="button-row">
          <button type="submit">上傳並摘要</button>
          <button type="button" onclick="window.location.href='/'">← 返回首頁</button>
        </div>
      </form>

      <!-- 顯示摘要 -->
      {% if pdf_summary %}
        <div class="summary">
          <h3 style="color:#ffaa00;">📜 摘要結果：</h3>
          <p>{{ pdf_summary }}</p>
        </div>
      {% endif %}
    </div>
  </div>

  <!-- 🔥 粒子動畫 -->
  <script>
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const particles = [];
    const max = 100;
    const colors = ["#ffaa00", "#ff6600", "#ff3300", "#ffffff"];

    for (let i = 0; i < max; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        d: Math.random() * max,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }

    let angle = 0;
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < max; i++) {
        const p = particles[i];
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.8;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
        ctx.fill();
      }
      update();
      requestAnimationFrame(draw);
    }

    function update() {
      angle += 0.01;
      for (let i = 0; i < max; i++) {
        const p = particles[i];
        p.y += Math.cos(angle + p.d) + 0.5;
        p.x += Math.sin(angle) * 0.5;
        if (p.y > canvas.height || p.x > canvas.width || p.x < 0) {
          p.y = 0;
          p.x = Math.random() * canvas.width;
        }
      }
    }

    draw();
  </script>
</body>
</html>
