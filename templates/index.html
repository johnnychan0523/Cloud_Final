<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>雲端AI工具箱</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at center, #ff5100, #1c0000);
      background-size: 400% 400%;
      animation: flameGlow 10s ease infinite;
      height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    @keyframes flameGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 80, 0, 0.8);
      text-align: center;
      width: 360px;
      border: 2px solid #ff6600;
      margin: auto;
      top: 50%;
      transform: translateY(-50%);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      color: #ffae00;
      text-shadow: 0 0 10px #ffae00;
    }

    button {
      background: linear-gradient(90deg, #ff6600, #ffae00);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      transition: 0.3s ease;
      box-shadow: 0 0 12px #ff5500;
    }

    button:hover {
      box-shadow: 0 0 20px #ffff33, 0 0 40px #ff6600;
      transform: scale(1.03);
    }

    form {
      margin: 10px 0;
    }

    audio {
      position: fixed;
      bottom: 10px;
      left: 10px;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- 🔥 火焰粒子動畫背景 -->
  <div id="particles-js"></div>

  <!-- 🔥 火焰感卡片 -->
  <div class="card">
    <h1>🔥 雲端AI工具箱 🔥</h1>

    <form action="/image" method="get">
      <button type="submit">🖼️ 圖片翻譯與語音</button>
    </form>

    <form action="/pdf" method="get">
      <button type="submit">📄 PDF 摘要工具</button>
    </form>

    <form action="/ocr_map_tool" method="get">
      <button type="submit">🗺️ OCR 地圖定位</button>
    </form>

    <form action="/menu" method="get">
      <button type="submit">🍽️ 智慧菜單 & 過敏原提醒</button>
    </form>
  </div>


  <!-- 🔥 引入 particles.js -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 60 },
        "color": { "value": "#ff6600" },
        "shape": { "type": "circle" },
        "opacity": {
          "value": 0.6,
          "random": true
        },
        "size": {
          "value": 5,
          "random": true
        },
        "move": {
          "enable": true,
          "speed": 2,
          "direction": "top",
          "straight": false
        }
      },
      "interactivity": {
        "events": {
          "onhover": { "enable": true, "mode": "repulse" }
        }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
