<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>OCR 地圖定位</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif;
      background: #1a0000;
      color: #fff;
      overflow-x: hidden;
      overflow-y: auto;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    canvas#bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: radial-gradient(ellipse at bottom, #2b0000 0%, #000000 100%);
    }

    .container {
      max-width: 600px;
      width: 100%;
      padding: 60px 20px;
    }

    .card {
      background: rgba(0, 0, 0, 0.85);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 80, 0, 0.9);
      border: 2px solid #ff6600;
    }

    h2 {
      font-size: 24px;
      color: #ffae00;
      text-shadow: 0 0 10px #ffae00;
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="file"],
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .button-row button {
      background: linear-gradient(90deg, #ff6600, #ffae00);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px #ff5500;
      transition: all 0.3s ease;
    }

    .button-row button:hover {
      box-shadow: 0 0 20px #ffff33, 0 0 40px #ff6600;
      transform: scale(1.05);
    }

    .result {
      background: #111;
      padding: 20px;
      border-radius: 12px;
      border-left: 5px solid #ffaa00;
      color: #ffeec0;
      font-size: 14px;
      white-space: pre-wrap;
      margin-bottom: 20px;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 12px;
      margin-top: 20px;
    }

    .warning {
      color: #ff6666;
      background: #220000;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <div class="container">
    <div class="card">
      <h2>🗺️ OCR 圖片地址定位</h2>

      <!-- 上傳圖片 -->
      <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image_file" accept="image/*" required />
        <div class="button-row">
          <button type="submit">📤 上傳圖片</button>
          <button type="button" onclick="window.location.href='/'">← 返回首頁</button>
        </div>
      </form>

      <!-- OCR 結果 -->
      {% if text %}
        <div class="result">
          <h3>🔍 偵測文字：</h3>
          {{ text }}
        </div>
      {% endif %}

      <!-- 地址查詢 -->
      <form method="POST">
        <input type="text" name="address" placeholder="請輸入地址" value="{{ query_address }}" required />
        <div class="button-row">
          <button type="submit" name="map_search" value="1">📍 查詢地圖</button>
        </div>
      </form>

      <!-- 地圖結果 -->
      {% if map_coords and map_coords.lat and map_coords.lon %}
        <iframe
          src="https://www.google.com/maps?q={{ map_coords.lat }},{{ map_coords.lon }}&hl=zh-TW&z=16&output=embed"
          allowfullscreen>
        </iframe>
      {% elif query_address %}
        <div class="warning">
          ⚠️ 無法找到地圖座標，請確認地址是否正確：<br>{{ query_address }}
        </div>
      {% endif %}
    </div>
  </div>

  <!-- 🔥 粒子動畫 -->
  <script>
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const particles = [];
    const max = 100;
    const colors = ["#ffaa00", "#ff6600", "#ff3300", "#ffffff"];

    for (let i = 0; i < max; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        d: Math.random() * max,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }

    let angle = 0;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < max; i++) {
        const p = particles[i];
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.8;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
        ctx.fill();
      }
      update();
      requestAnimationFrame(draw);
    }

    function update() {
      angle += 0.01;
      for (let i = 0; i < max; i++) {
        const p = particles[i];
        p.y += Math.cos(angle + p.d) + 0.5;
        p.x += Math.sin(angle) * 0.5;

        if (p.y > canvas.height || p.x > canvas.width || p.x < 0) {
          p.y = 0;
          p.x = Math.random() * canvas.width;
        }
      }
    }

    draw();
  </script>
</body>
</html>
